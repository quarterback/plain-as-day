name: Publish to MCP Registry

# Publish the npm package version in server.json before running this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run tests
        run: npm test

      - name: Confirm npm version and registry metadata
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          MCP_NAME=$(node -p 'require("./package.json").mcpName')
          test "$(jq -r '.name' server.json)" = "$MCP_NAME"
          test "$(jq -r '.version' server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].identifier' server.json)" = "$NAME"
          test "$(jq -r '.packages[0].version' server.json)" = "$VERSION"
          echo "Checking published npm package: $NAME@$VERSION"
          PUBLISHED_MCP_NAME=$(npm view "$NAME@$VERSION" mcpName --json | tr -d '"')
          if [ "$PUBLISHED_MCP_NAME" != "$MCP_NAME" ]; then
            echo "The npm release lacks matching mcpName. Publish a new version to npm first."
            exit 1
          fi

      - name: Download the official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate using GitHub Actions
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish server.json
